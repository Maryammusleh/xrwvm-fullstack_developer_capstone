name: Lint Code
on: [push, pull_request]
jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --upgrade pip flake8
      - name: Print working directory
        run: pwd
      - name: Run Linter
        run: flake8 --exit-zero --max-line-length=150 server/djangoapp && echo "Linted all the python files successfully"
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with: {node-version: 18}
      - name: Install JSHint
        run: npm install jshint --global
      - name: Run Linter
        run: jshint --config /dev/null server/database/app.js || true; echo "Linted all the js files successfully"
